name: fuzz

# Coverage-guided fuzzing of the code that parses input this project does not
# control: the health report read off a socket, the settings file edited by hand,
# and the bytes a Modbus gateway sends.
#
# Pull requests get a short run per target, enough to replay the accumulated
# corpus and catch a regression while the change is being reviewed. The weekly
# run is the one that explores: it starts from the cached corpus, so coverage
# keeps growing from week to week instead of restarting from nothing.
#
# Not ClusterFuzzLite: its Python base image ships 3.11, and this project needs
# 3.12 or newer.

on:
  pull_request:
    paths:
      - 'fuzz/**'
      - 'kronoterm2mqtt/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '40 3 * * 2'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds to fuzz each target'
        required: false
        default: '600'

permissions: read-all

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_health_report
          - fuzz_settings
          - fuzz_modbus_frame

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba  # main
        with:
          # Atheris publishes wheels for 3.12 to 3.14; this is the version the
          # released container runs.
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@19b4d1e990bec64818914c40230bde93a0de300b  # main

      - name: Install the app and Atheris
        run: |
          uv sync --frozen --no-dev
          uv pip install atheris

      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }}
        env:
          # A pull request checks for regressions; the scheduled run explores.
          SECONDS_TO_FUZZ: ${{ inputs.seconds || (github.event_name == 'pull_request' && '120' || '900') }}
        run: |
          mkdir -p corpus/${{ matrix.target }} artifacts
          uv run python fuzz/${{ matrix.target }}.py \
            corpus/${{ matrix.target }} \
            -max_total_time="${SECONDS_TO_FUZZ}" \
            -print_final_stats=1 \
            -artifact_prefix=artifacts/

      - name: Save the corpus
        # Also after a crash: the input that found it is worth keeping.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: crash-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: ignore
