---
# Home Assistant add-on manifest.
#
# Every setting kronoterm2mqtt has is an option here, so the whole configuration can
# be done in the Home Assistant interface. The entrypoint (kronoterm2mqtt.ha_addon)
# renders these into the TOML settings file the app reads.
#
# The option names and defaults mirror the settings dataclasses in
# kronoterm2mqtt/user_settings.py, and a test fails if they drift apart:
# kronoterm2mqtt/tests/test_ha_addon.py
name: kronoterm2mqtt
version: "0.1.20"
slug: kronoterm2mqtt
description: >-
  Publish a KRONOTERM heat pump to MQTT, with Home Assistant discovery for every
  sensor, switch and setting.
url: https://github.com/dgprivate/kronoterm2mqtt
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
# So the Supervisor can hand over the credentials of the Mosquitto add-on
services:
  - mqtt:want
# Serial devices, for a heat pump connected over RS485 instead of a TCP gateway
uart: true
# Read-only, for the MQTT TLS certificates: /ssl is where Home Assistant keeps its own,
# /share is where you can put anything else.
map:
  - share:ro
  - ssl:ro
# Restart the add-on when the health endpoint stops answering. The same watchdog the
# plain container has, run by the Supervisor instead of by Docker.
watchdog: http://[HOST]:[PORT:8099]/health
ports:
  8099/tcp: null  # Not published to the host: the watchdog reaches it internally
ports_description:
  8099/tcp: Health endpoint (MQTT, Modbus and publishing status)

options:
  log_level: info
  mqtt:
    use_supervisor: true
    host: ""
    port: 1883
    user_name: ""
    password: ""
    main_uid: kronoterm
    publish_config_throttle_seconds: 20
    publish_throttle_seconds: 5
  mqtt_tls:
    enabled: false
    ca_certs: ""
    certfile: ""
    keyfile: ""
    insecure: false
  heat_pump:
    definitions_name: kronoterm_ksm
    device_name: Heat Pump
    model: ETERA
    port: /dev/ttyUSB0
    timeout: 0.5
    pooling_interval: 10
  health:
    enabled: true
    # 0.0.0.0 rather than 127.0.0.1: the Supervisor watchdog connects from outside the
    # container. The port is not published to the host.
    host: 0.0.0.0
    port: 8099
    stale_after_seconds: 60
    restart_after_seconds: 300
  custom_expander:
    module_enabled: false
    uid: etera_expander_module
    name: Custom ETERA Expander Module
    model: DIY
    mqtt_payload_prefix: expander
    port: /dev/ttyUSB1
    port_speed: 115200
    timeout: 0.5
    number_of_thermometers: 9
    loop_operation: [1, 1, 1, 0]
    loop_sensors: [1, 0, 6, 5]
    loop_temperature: [25.0, 25.0, 25.0, 25.0]
    heating_curve_coefficient: 0.25
    solar_pump_operation: 1
    solar_pump_difference_on: 8.0
    solar_pump_difference_off: 3.0
    intra_tank_circulation_operation: true
    intra_tank_circulation_difference_on: 8.0
    intra_tank_circulation_difference_off: 5.0
    solar_sensors: [4, 3, 2, 8, 7]
    solar_pump_relay_id: 4
    inter_tank_pump_relay_id: 5
    sensor_names:
      - Spalnice
      - Mansarda
      - Nadgaražje
      - Pritličje
      - Kolektorji
      - Solarni zgoraj
      - Solarni spodaj
      - Bojler
      - Cirkulacija
    relay_names:
      - Črpalka spalnic
      - Črpalka mansarde
      - Črpalka nadgaražja
      - ""
      - Črpalka kolektorjev
      - Cirkulacija med bojlerjema
      - ""
      - ""

schema:
  log_level: list(error|warning|info|debug)
  mqtt:
    use_supervisor: bool
    host: str?
    port: port
    user_name: str?
    password: password?
    main_uid: str
    publish_config_throttle_seconds: int(1,3600)
    publish_throttle_seconds: int(1,3600)
  mqtt_tls:
    enabled: bool
    ca_certs: str?
    certfile: str?
    keyfile: str?
    insecure: bool
  heat_pump:
    definitions_name: str
    device_name: str
    model: str
    port: str
    timeout: float
    pooling_interval: int(1,3600)
  health:
    enabled: bool
    host: str
    port: port
    stale_after_seconds: int(1,86400)
    restart_after_seconds: int(0,86400)
  custom_expander:
    module_enabled: bool
    uid: str
    name: str
    model: str
    mqtt_payload_prefix: str
    port: str
    port_speed: int
    timeout: float
    number_of_thermometers: int(0,64)
    loop_operation:
      - int(0,1)
    loop_sensors:
      - int
    loop_temperature:
      - float
    heating_curve_coefficient: float
    solar_pump_operation: int(0,1)
    solar_pump_difference_on: float
    solar_pump_difference_off: float
    intra_tank_circulation_operation: bool
    intra_tank_circulation_difference_on: float
    intra_tank_circulation_difference_off: float
    solar_sensors:
      - int
    solar_pump_relay_id: int
    inter_tank_pump_relay_id: int
    sensor_names:
      - str
    relay_names:
      - str?
