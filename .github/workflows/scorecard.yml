name: scorecard

# OpenSSF Scorecard grades the supply chain around this repository: whether
# dependencies are pinned, whether something keeps them moving, whether workflow
# tokens are least-privilege, whether releases are signed. The result is published
# so the badge in README.md can read it.

on:
  push:
    branches:
      - main
  branch_protection_rule:  # Scorecard grades these, so re-run when they change
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Upload the findings to the Security tab
      id-token: write  # Publish the result, which is what the badge reads
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the result as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
