name: publish image

# Publishing is opt-in, so this is a no-op in a fork that has not set it up:
#
#   1. create a Docker Hub access token (Account Settings -> Personal access tokens)
#   2. repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   3. repository variable: DOCKERHUB_IMAGE, e.g. "your-user/kronoterm2mqtt"
#
# Without DOCKERHUB_IMAGE the job is skipped and nothing is pushed.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    # The base image digest is pinned, but "apk upgrade" in the runtime stage pulls
    # whatever Alpine has patched since, so a rebuild is what actually ships fixes.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: read-all  # Jobs that need more ask for it themselves

jobs:
  publish:
    if: vars.DOCKERHUB_IMAGE != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Attach the signed SBOM to the release
      id-token: write  # Keyless signing through Sigstore

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          submodules: recursive  # kronoterm2mqtt/pyetera_uart_bridge is a symlink into it
          fetch-depth: 0

      - name: Read the package version
        id: version
        run: |
          version=$(sed -n 's/^__version__ = .\(.*\).$/\1/p' kronoterm2mqtt/__init__.py)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4  # For the linux/arm64 build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4  # docker-container driver, so attestations work

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Collect tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          # The image carries an SBOM file of its own; these are the registry-side
          # attestations, which only a container driver can produce.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        # Pinned to a release: this action publishes no floating v4 tag
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign the image
        # Keyless: the signature is bound to this workflow's OIDC identity, so there
        # is no private key to store or rotate. Verify with:
        #   cosign verify <image>@<digest> \
        #     --certificate-identity-regexp '^https://github.com/.+/.github/workflows/publish-image.yml@.+' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Attach a signed SBOM to the release
        # Only for a tag: the release gets the inventory of what was published, and a
        # Sigstore bundle so it can be verified without trusting this repository.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --entrypoint cat "${IMAGE}@${DIGEST}" \
            /usr/share/kronoterm2mqtt/sbom.cdx.json > "kronoterm2mqtt-${TAG}.sbom.cdx.json"
          cosign sign-blob --yes \
            --bundle "kronoterm2mqtt-${TAG}.sbom.cdx.json.sigstore.json" \
            "kronoterm2mqtt-${TAG}.sbom.cdx.json"
          gh release upload "${TAG}" \
            "kronoterm2mqtt-${TAG}.sbom.cdx.json" \
            "kronoterm2mqtt-${TAG}.sbom.cdx.json.sigstore.json" \
            --clobber

      - name: Render the Docker Hub overview
        # The page names the image and the release it documents, so it is written
        # with placeholders and filled in here.
        run: |
          sed -e "s|IMAGE_NAME|${IMAGE}|g" -e "s|IMAGE_VERSION|${VERSION}|g" \
            .github/dockerhub-overview.md > "${RUNNER_TEMP}/overview.md"
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Update the Docker Hub description
        # The image is pushed and signed by now, so a page that did not update is
        # not a failed release. It also needs a token with delete scope, which the
        # one used for pushing does not have to have.
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE }}
          short-description: 'KRONOTERM heat pump to MQTT bridge for Home Assistant, Modbus RTU or TCP'
          readme-filepath: ${{ runner.temp }}/overview.md

      - name: Scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          # Findings we have analysed and ruled out - see security/README.md
          TRIVY_VEX: security/kronoterm2mqtt.openvex.json
        with:
          image-ref: ${{ vars.DOCKERHUB_IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true  # Report what can actually be acted on
          exit-code: '1'
          format: table
