# Keeping the pins current is the other half of pinning them: a digest that never
# moves is a digest that collects advisories.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'Update'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'Update'

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'Update'
    groups:
      # One pull request for the development tooling, so the interesting ones stand out
      dev-dependencies:
        dependency-type: development
